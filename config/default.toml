# Core indicator parameters
[indicators]
ema_fast = 20
ema_slow = 50
ema_trend = 200
atr_length = 14
rsi_length = 14
volume_ma_length = 20
adx_length = 14
adx_smoothing = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9
ob_displacement_atr = 0.65
sr_cluster_atr = 0.35
sr_near_atr = 0.50
sr_daily_lookback = 24
sr_weekly_lookback = 168
cmf_length = 20
obv_slope_length = 10
rvol_length = 20
rvol_min = 1.20
rs_length = 10
htf_ema_fast = 21
htf_ema_mid = 55
htf_ema_trend = 200
# V61.x Pine indicator knobs (sub-phase 1.7.12)
session_volume_baseline_length = 34
session_volume_shock_z = 2.20
session_breakout_volume_ratio = 1.15
bos_close_buffer_atr = 0.10
choch_close_buffer_atr = 0.12
liquidity_equal_atr = 0.20
ob_validation_vol_ratio = 1.10
momentum_decay_bars = 8

[strategy]
min_directional_gap = 10.0
min_confidence_15m = 72.0
min_confidence_1h = 67.0
min_confidence_4h = 64.0
min_confidence_1d = 58.0
structure_lookback = 18
min_structure_score = 60.0
min_structure_edge = 0.15

[strategy.mtf]
consensus_score_gap = 12.0
flip_confirm_bars = 2
micro_trend_bars = 5
micro_trend_min_bars = 3

[entry_plan]
swing_lookback = 24
ew1_min_atr = 0.12
ew1_max_atr = 0.85
ew2_atr = 0.42
ew3_atr = 0.78
deep_add_atr = 1.12
entry_zone_atr = 0.15
tp1_atr = 0.48
tp2_atr = 0.88
tp3_atr = 1.35
tp_step_min_atr = 0.22
max_tp1_atr = 0.95
max_tp2_atr = 1.45
max_tp3_atr = 2.10
min_sl_distance_atr = 0.50
max_sl_distance_atr = 3.20
sl_extra_asia_atr = 0.15
sl_extra_europe_atr = 0.22
sl_extra_usa_atr = 0.30
sl_trap_extra_atr = 0.30
sl_wick_extra_atr = 0.20
sl_vol_extra_atr = 0.25
wick_off_lookback = 6
wick_off_buffer_atr = 0.45
max_sl_asia_atr = 1.60
max_sl_europe_atr = 1.90
max_sl_usa_atr = 2.20
min_pullback_atr = 0.18
target_clear_atr = 0.08
no_chase_tp1_atr = 0.20
sl_wide_threshold_atr = 2.00
# V61.x entry-window micro buffers (sub-phase 1.7.12)
ew_micro_1_atr = 0.06
ew_micro_2_atr = 0.12
ew_micro_3_atr = 0.20
ew_session_open_buffer_atr = 0.18
min_rr_trade = 1.6

[entry_plan.flow]
flow_lookback = 34
low_flow_vol_ratio = 0.78
high_flow_vol_ratio = 1.35
low_flow_atr_ratio = 0.82
high_flow_atr_ratio = 1.18
low_liq_tp1_max_atr = 0.26
low_liq_tp2_max_atr = 0.43
low_liq_tp3_max_atr = 0.62
mid_liq_tp1_max_atr = 0.38
mid_liq_tp2_max_atr = 0.68
mid_liq_tp3_max_atr = 0.95
low_liq_min_step_atr = 0.14
low_flow_prob_penalty = 14.0
flow_trap_wick_ratio = 0.58

[entry_plan.probability]
min_tp1_prob = 60
min_tp2_prob = 42

[trap_guard]
trap_score_threshold = 60.0
trap_volume_z = 2.0
wick_trap_atr = 0.70
cooldown_bars = 3
cooldown_band_low_bars = 4
cooldown_band_mid_bars = 6
cooldown_band_high_bars = 7
cooldown_band_mid_score = 75.0
cooldown_band_high_score = 90.0
shock_freeze_bars = 5
deep_reclaim_bars = 3
min_swing_distance_atr = 0.45
pressure_cluster_bars = 8
pressure_cluster_min = 3
pressure_vol_ratio = 1.15
shock_range_atr = 2.50
shock_body_atr = 1.40
distribution_reject_bars = 5
sess_vol_breakout_ratio = 1.15

[session]
timezone = "Asia/Jakarta"
asia_start = "06:00"
asia_end = "14:00"
europe_start = "14:00"
europe_end = "22:00"
usa_start = "19:00"
usa_end = "03:00"
idx_start = "09:00"
idx_end = "15:00"
forex_rollover_avoid_start = "04:55"
forex_rollover_avoid_end = "06:10"

[server]
enabled = false
host = "127.0.0.1"
port = 8080
request_timeout_secs = 10
auth_token_env = "COINNESIA_API_TOKEN"

[alerts]
enabled = false
poll_interval_secs = 2
batch_size = 25
dedupe_ttl_secs = 300

[alerts.telegram]
enabled = false
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
api_base_url = "https://api.telegram.org"
parse_mode = "HTML"
disable_web_page_preview = true

[database]
enabled = true
url_env = "DATABASE_URL"
max_connections = 10
min_connections = 1
connect_timeout_secs = 5
migrate_on_start = false

[cache]
enabled = true
url_env = "VALKEY_URL"
key_prefix = "coinnesia"
pool_size = 10
ttl_seconds = 300

[runtime]
scan_interval_secs = 60
shutdown_timeout_secs = 15
max_symbol_tasks = 128
health_stale_after_secs = 180

[data_sources]
primary = "binance"
fallback = "tradingview"
candle_limit = 250
scanning_mode = "polling"

[data_sources.retry]
max_retries = 1
base_delay_ms = 500
max_delay_ms = 10000

[data_sources.tradingview]
enabled = true
auth_token_env = "TRADINGVIEW_AUTH_TOKEN"
session_id_env = "TRADINGVIEW_SESSION_ID"
session_signature_env = "TRADINGVIEW_SESSIONID_SIGN"
device_token_env = "TRADINGVIEW_DEVICE_T"

[data_sources.twelvedata]
enabled = false
base_url = "https://api.twelvedata.com"
api_key_env = "TWELVE_DATA_API_KEY"

[exchange]
platform = "paper"
testnet = true
rate_limit_per_second = 10

[exchange.binance]
api_key_env = "BINANCE_API_KEY"
api_secret_env = "BINANCE_API_SECRET"
account_type = "spot"
recv_window = 5
testnet = false
market_data_mode = "http"
http_poll_interval = 1
rest_url = "https://api.binance.com"
websocket_url = "wss://stream.binance.com:9443"

[exchange.binance.ws]
enabled = true
url = "wss://stream.binance.com/stream"
max_streams_per_connection = 200
reconnect_base_delay_ms = 1000
reconnect_max_delay_ms = 30000
candle_buffer_size = 500

[trading]
enabled = false
mode = "scan_only"
order_type = "limit"
use_oco = true
trailing_stop_after_tp1 = true
trailing_stop_atr = 0.50

[trading.scaling]
ew1_pct = 40.0
ew2_pct = 30.0
ew3_pct = 20.0
deep_add_pct = 10.0
tp1_close_pct = 50.0
tp2_close_pct = 30.0
tp3_close_pct = 20.0

[portfolio]
total_capital_usdt = 10000.0
reserve_pct = 10.0
max_open_positions = 10
max_positions_per_asset = 4

[portfolio.allocation]
btc_pct = 30.0
altcoin_pct = 25.0
gold_pct = 15.0
forex_pct = 15.0
stocks_pct = 15.0

[risk]
max_risk_per_trade_pct = 2.0
position_sizing_method = "fixed_pct"
min_risk_reward = 1.5
max_trades_per_day = 20
cooldown_after_loss_secs = 300

[risk.drawdown]
warning_pct = 3.0
caution_pct = 5.0
critical_pct = 8.0
max_account_drawdown_pct = 15.0

[risk.kill_switch]
enabled = true
close_positions_on_trigger = true
max_api_errors = 10
manual_restart_required = true

[backtest]
enabled = false
start_date = "2024-01-01"
end_date = "2025-01-01"
initial_capital = 10000.0
data_source = "api"

[backtest.fees]
maker_fee_pct = 0.02
taker_fee_pct = 0.04
slippage_model = "fixed"
slippage_bps = 5.0

# Per-asset overrides (sub-phase 1.7.12). Defaults below mirror Pine V61.x–V62 inputs
# so per-class evaluators can read knobs from TOML instead of hard-coding constants.
[assets.altcoin]
alt_ew_vol_compress = 0.85
alt_tp_thin_compress = 0.78
alt_sl_wick_buffer_atr = 0.35
alt_trap_sensitivity = 1.10
alt_min_break_body_atr = 0.55
alt_max_chase_atr = 0.60
alt_ltf_weight = 1.20
alt_htf_relax = 0.85
# AUTO | MAJOR | MID | MEME — controls the altcoin sensitivity preset.
alt_profile = "AUTO"

[assets.gold]
# session | proxy | hybrid — drives how XAUUSD session bias is sourced.
gold_session_bias_mode = "hybrid"
gold_news_window_atr = 1.80
gold_proxy_min_alignment = 0.65

[assets.forex]
forex_rr_asia = 1.40
forex_rr_europe = 1.80
forex_rr_usa = 2.00
forex_block_counter_htf = true

[assets.stocks_idx]
idx_rvol_min = 1.10
idx_cmf_length = 20
idx_obv_slope_bars = 10
idx_value_traded_min = 500000000.0
idx_rs_min = 0.0
idx_downside_risk_threshold = 1.35

[[symbols]]
symbol = "BTCUSDT"
asset_class = "btc"
exchange = "binance"
data_source = "binance"
timeframes = ["15m", "1h", "4h", "1d"]

#[[symbols]]
#symbol = "ETHUSDT"
#asset_class = "btc"
#exchange = "binance"
#data_source = "binance"
#timeframes = ["15m", "1h", "4h", "1d"]

[[symbols]]
symbol = "PAXGUSDT"
asset_class = "gold"
exchange = "binance"
data_source = "binance"
timeframes = ["15m", "1h", "4h", "1d"]

[[symbols]]
symbol = "XAUUSD"
asset_class = "gold"
exchange = ""
data_source = "tradingview"
timeframes = ["15m", "1h", "4h", "1d"]

# Forex currency-pair example (sub-phase 1.7.12) — exercises AssetClass::Forex
# end-to-end in `check-config` and the per-class evaluator branch.
[[symbols]]
symbol = "EURUSD"
asset_class = "forex"
exchange = ""
data_source = "tradingview"
timeframes = ["15m", "1h", "4h", "1d"]

[[symbols]]
symbol = "IDX:COMPOSITE"
asset_class = "stocks_idx"
exchange = ""
data_source = "tradingview"
timeframes = ["15m", "1h", "4h", "1d"]

[proxy_symbols.xauusd]
tradingview = "OANDA:XAUUSD"
twelvedata  = "XAU/USD"
source      = "tradingview"   # switch to "twelvedata" when TradingView session expires

[proxy_symbols.ihsg]
tradingview = "IDX:COMPOSITE"
twelvedata  = "IDXSMC.COM"
source      = "tradingview"

[proxy_symbols.dxy]
tradingview = "TVC:DXY"
twelvedata  = "DXY"           # verify with: curl "https://api.twelvedata.com/symbol_search?symbol=DXY&apikey=YOUR_KEY"
source      = "tradingview"
